features_csv: data/processed/features/dataset_final.csv
label_col: label_id

model_type: xgb

out_dir: models
ckpt_name: checkpoint_xgb.joblib
metrics_out: outputs/stats/train_metrics_xgb.csv

cv:
  n_splits: 5
  group_by_patient: true
  shuffle: false
  random_state: 42

xgb_params:
  n_estimators: 400
  max_depth: 5
  learning_rate: 0.05
  subsample: 0.8
  colsample_bytree: 0.8
  objective: multi:softprob
  n_jobs: -1
  reg_lambda: 1.0
  reg_alpha: 0.0
