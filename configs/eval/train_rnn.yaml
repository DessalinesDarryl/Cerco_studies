features_csv: data/processed/features/dataset_final.csv
label_col: label_id

model_type: rnn

out_dir: data/models
ckpt_name: checkpoint_rnn.pt
metrics_out: data/outputs/stats/train_metrics_rnn.csv

cv:
  n_splits: 5
  group_by_patient: true
  shuffle: false
  random_state: 42

training:
  n_epochs: 40
  batch_size: 32
  lr: 0.001
  weight_decay: 0.0
  device: "cuda"   # ou "cpu"

rnn_params:
  hidden_dim: 64
  num_layers: 1
  bidirectional: false
  dropout: 0.3
