features_csv: data/processed/features/dataset_final.csv
label_col: label_id

model_type: knn

out_dir: models
ckpt_name: checkpoint_knn.joblib
metrics_out: outputs/stats/train_metrics_knn.csv

cv:
  n_splits: 5
  group_by_patient: true
  shuffle: false
  random_state: 42

knn_params:
  n_neighbors: 7
  weights: distance
  metric: minkowski
