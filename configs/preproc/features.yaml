in_root: data/processed/rem_epochs/
out_csv: data/processed/features/features.csv
rbd_emg_csv: data/processed/rbd/rbd_emg_per_epoch.csv

eeg:
  temporal: true
  spectral: true
  connectivity: true
  microstates: true
  bands:
    delta: [0.5, 4.0]
    theta: [4.0, 8.0]
    alpha: [8.0, 13.0]
    beta:  [13.0, 30.0]
    gamma_bas: [30.0, 50.0]
    gamma_haut: [50.0, 80.0]

emg:
  temporal: true
  spectral: true
  rbd_indices: true     # ce qu’on peut calculer en REM-only

coupling:
  eeg_emg_coherence: true
  cross_corr: true
  pac: false            # TODO : à implémenter plus tard
