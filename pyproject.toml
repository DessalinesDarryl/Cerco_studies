[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cerco-studies"
version = "0.1.0"
description = "RSWA severity scoring pipeline for multi-etiology RBD sleep studies (iRBD, narcolepsy, synucleinopathies, auto-immune encephalitis)"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
keywords = ["EMG", "RBD", "RSWA", "sleep", "iRBD", "narcolepsy", "severity scoring", "activation detection"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

dependencies = [
    "mne>=1.6.0",
    "numpy>=2.0.0,<3.0.0",
    "pandas>=2.0.0",
    "scipy>=1.12.0",
    "scikit-learn>=1.4.0",
    "statsmodels>=0.14.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-xdist>=3.5.0",
    "black>=23.10.0",
    "pylint>=3.0.0",
    "mypy>=1.5.0",
    "isort>=5.12.0",
    "flake8>=6.1.0",
]

notebooks = [
    "jupyter>=1.0.0",
    "ipykernel>=6.26.0",
    "ipywidgets>=8.1.0",
    "notebook>=7.0.0",
]

streamlit = [
    "streamlit>=1.28.0",
]

[project.urls]
"Homepage" = "https://github.com/yourname/cerco-studies"
"Documentation" = "https://github.com/yourname/cerco-studies/README.md"
"Source" = "https://github.com/yourname/cerco-studies"

[tool.setuptools]
packages = ["scripts"]

[tool.setuptools.package-dir]
"" = "."

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311"]
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_mode = 3
include_trailing_comma = true

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.4"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=src --cov-report=term-missing --cov-report=html"
